<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>到账记录 · 收款管理</title>
<style>
[hidden]{display:none!important}
:root{--bg:#f8fafc;--card:#fff;--ink:#1e293b;--muted:#475569;--line:#cbd5e1;--accent:#1d4ed8;--warn:#92400e}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,sans-serif}main{max-width:1440px;margin:auto;padding:32px 24px}header,.toolbar,nav{display:flex;gap:12px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}h1{font-size:28px;margin:12px 0}h2{font-size:20px}p{color:var(--muted)}a{color:var(--accent)}button,input,select,textarea{font:inherit;min-height:44px;border:1px solid var(--line);border-radius:6px;padding:8px 12px;background:var(--card);color:var(--ink)}button{cursor:pointer}button:hover{border-color:var(--accent);background:#eff6ff}button:disabled{opacity:.55;cursor:default}:focus-visible{outline:3px solid var(--accent);outline-offset:3px}label{display:grid;gap:4px;font-size:14px}input{width:100%;min-width:260px}.toolbar{align-items:end;margin:24px 0}.table-wrap{overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:8px}table{border-collapse:collapse;width:100%;text-align:left;font-size:14px}th,td{padding:14px;vertical-align:top;border-bottom:1px solid var(--line)}th{background:var(--bg);white-space:nowrap}td{max-width:320px;overflow-wrap:anywhere}.mono{font-family:ui-monospace,monospace;font-size:13px}.badge{display:inline-block;padding:2px 8px;background:#e2e8f0;border-radius:4px;white-space:nowrap}.exception{color:var(--warn);background:#fef3c7}.settled{color:#166534;background:#dcfce7}small{display:block;color:var(--muted)}nav{justify-content:flex-end;margin:16px 0}#message{min-height:26px}dialog{border:1px solid var(--line);border-radius:12px;max-width:600px;width:calc(100% - 32px);padding:24px}dialog::backdrop{background:#0f172a80}textarea{width:100%;min-height:130px}#detail{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px}#error{color:#b91c1c}details{margin:32px 0}@media(max-width:600px){main{padding:20px 12px}.toolbar>label{width:100%}h1{font-size:24px}th,td{padding:10px}}
</style></head><body><main>
<header><div><a href="/">返回管理后台</a><h1>到账记录</h1></div><button id="reload" type="button">刷新</button></header>
<p>少付和超付按首次有效到账金额结算。异常记录需要人工核对；标记处理只保存说明，不会修改订单或发送成功回调。</p>
<form id="filters" class="toolbar"><label>状态<select id="status"><option value="exception">待处理异常</option><option value="settled">已结算</option><option value="resolved">已人工处理</option><option value="">全部</option></select></label><label>网络<select id="network"><option value="">全部网络</option><option>tron</option><option>solana</option><option>aptos</option><option>ethereum</option><option value="binance">BSC</option><option>polygon</option><option>plasma</option><option>ton</option></select></label><label style="flex:1">订单号 / 哈希 / 地址（完整值）<input id="keyword" autocomplete="off"></label><button type="submit">查询</button></form>
<p id="message" role="status" aria-live="polite"></p><div class="table-wrap"><table><thead><tr><th>发现时间</th><th>网络 / 实收</th><th>订单 / 收款地址</th><th>状态 / 原因</th><th>交易哈希</th><th>操作</th></tr></thead><tbody id="rows"></tbody></table></div><nav aria-label="列表分页"><button id="prev">上一页</button><span id="page"></span><button id="next">下一页</button></nav>
<details><summary>地址占用情况（已分配过的地址）</summary><p>空闲地址优先按最久释放时间分配。刚释放的地址可以被再次分配，轮询不能彻底排除迟到款串单。</p><div class="table-wrap"><table><thead><tr><th>网络 / 币种</th><th>地址</th><th>当前订单</th><th>最近释放</th></tr></thead><tbody id="addresses"></tbody></table></div></details>
<dialog id="dialog"><form id="resolve"><h2>到账详情与处理记录</h2><div id="detail"></div><label id="note-label">处理说明<textarea id="note" maxlength="2000" placeholder="例如：已核对原订单，线下退款；退款凭证……"></textarea></label><p id="error" role="alert"></p><nav><button type="button" id="cancel">关闭</button><button id="save" type="submit">标记已处理</button></nav></form></dialog>
</main><script>
'use strict';
const $=id=>document.getElementById(id);
let currentPage=1,total=0,selected=null,loading=false,requestId=0,controller;
let activeFilters={status:'exception',network:'',keyword:''};
const names={exception:'待处理',settled:'已结算',resolved:'已人工处理'};
const reasons={late_payment:'超时到账',closed_order:'订单已关闭或已过期',duplicate_payment:'订单已完成后的重复付款',asset_mismatch:'资产或精度不符',asset_or_assignment_mismatch:'没有对应的地址分配记录',missing_chain_time:'缺少链上时间',ambiguous_chain_time:'链上时间精度不足，需人工核对',below_minimum:'低于币种最小金额',below_settlement_precision:'低于结算精度',assignment_released:'地址占用已释放',parent_closed:'主订单已结束',unassigned:'未匹配订单'};
function token(){try{const v=document.cookie.split('; ').find(x=>x.startsWith('access_token='));return v?JSON.parse(decodeURIComponent(v.slice(13))):''}catch{return ''}}
async function api(path,options={}){const response=await fetch('/admin/api/v1/'+path,{...options,headers:{'Authorization':'Bearer '+token(),'Content-Type':'application/json'}});if(response.status===401){location.assign('/sign-in?redirect='+encodeURIComponent('/admin/collections'));throw Error('请先登录管理后台')}const body=await response.json();if(!response.ok||body.status_code!==200)throw Error(body.message||'请求失败');return body.data}
const dt=x=>x?new Date(x).toLocaleString():'—';function cell(tr,text,cls){const c=document.createElement('td');c.textContent=text;c.className=cls||'';tr.append(c);return c}
function readFilters(){return {status:$('status').value,network:$('network').value,keyword:$('keyword').value.trim()}}
function setLoading(value){
  loading=value;
  $('reload').disabled=value;
  $('prev').disabled=value||currentPage<=1;
  $('next').disabled=value||currentPage*25>=total;
  $('rows').closest('table').setAttribute('aria-busy',String(value));
}
async function load(page=currentPage,filters=activeFilters){
  const id=++requestId;
  controller?.abort();
  controller=new AbortController();
  const options={signal:controller.signal},snapshot={...filters};
  setLoading(true);
  $('message').textContent='正在加载到账记录…';
  try{
    const q=new URLSearchParams({page,...snapshot});
    // Keep both tables on the same submitted filters. A later query cancels
    // this request and only its response may update the page or pagination.
    const [data,addresses]=await Promise.all([
      api('payment-receipts?'+q,options),
      api('payment-addresses?network='+encodeURIComponent(snapshot.network),options)
    ]);
    if(id!==requestId)return;
    const lastPage=Math.max(1,Math.ceil(data.total/25));
    if(page>lastPage)return load(lastPage,snapshot);
    const receiptRows=document.createDocumentFragment();
    for(const row of data.list){
      const tr=document.createElement('tr');
      cell(tr,dt(row.created_at));
      cell(tr,row.network+' / '+row.amount+' '+row.token);
      cell(tr,(row.parent_trade_id||row.trade_id||'未匹配订单')+'\n'+row.address,'mono');
      const state=cell(tr,'');
      const badge=document.createElement('span');
      badge.className='badge '+row.status;badge.textContent=names[row.status]||row.status;state.append(badge);
      const reason=document.createElement('small');reason.textContent=reasons[row.reason]||row.reason;state.append(reason);
      cell(tr,row.tx_hash,'mono');
      const action=cell(tr,''),button=document.createElement('button');
      button.textContent=row.status==='exception'?'核对处理':'查看详情';
      button.onclick=()=>show(row);action.append(button);receiptRows.append(tr);
    }
    const addressRows=document.createDocumentFragment();
    for(const row of addresses){
      const tr=document.createElement('tr');
      cell(tr,row.network+' / '+row.token);cell(tr,row.address,'mono');
      cell(tr,row.trade_id||'空闲','mono');cell(tr,dt(row.last_released_at));addressRows.append(tr);
    }
    $('rows').replaceChildren(receiptRows);
    $('addresses').replaceChildren(addressRows);
    currentPage=page;total=data.total;activeFilters=snapshot;
    $('message').textContent=total?'共 '+total+' 条记录':'没有符合条件的到账记录。';
    $('page').textContent='第 '+currentPage+' 页';
  }catch(e){
    if(id===requestId&&e.name!=='AbortError')$('message').textContent=e.message;
  }finally{
    if(id===requestId)setLoading(false);
  }
}
function show(row){selected=row;$('detail').textContent='记录 #'+row.id+'\n主订单：'+(row.parent_trade_id||row.trade_id||'—')+'\n支付订单：'+(row.trade_id||'—')+'\n交易哈希：'+row.tx_hash+'\n转账事件：'+row.event_id+'\n资产标识：'+row.asset_id+'\n链上金额：'+row.amount+' '+row.token+'\n链上时间：'+dt(row.block_time_ms)+'\n原因：'+(reasons[row.reason]||row.reason||'—')+(row.note?'\n处理人：'+row.resolved_by+'\n处理时间：'+dt(row.resolved_at)+'\n说明：'+row.note:'');$('note').value='';$('error').textContent='';const readOnly=row.status!=='exception';$('save').hidden=$('note-label').hidden=readOnly;$('note').disabled=readOnly;$('dialog').showModal()}
$('resolve').onsubmit=async e=>{e.preventDefault();if(!selected||selected.status!=='exception')return;const note=$('note').value.trim();if(!note){$('error').textContent='请填写核对结果和处理说明。';$('note').focus();return}$('save').disabled=true;try{await api('payment-receipts/'+selected.id+'/resolve',{method:'POST',body:JSON.stringify({note})});$('dialog').close();await load()}catch(e){$('error').textContent=e.message}finally{$('save').disabled=false}};
$('cancel').onclick=()=>$('dialog').close();
$('reload').onclick=()=>load();
$('filters').onsubmit=e=>{e.preventDefault();load(1,readFilters())};
$('prev').onclick=()=>{if(!loading&&currentPage>1)load(currentPage-1)};
$('next').onclick=()=>{if(!loading&&currentPage*25<total)load(currentPage+1)};
load(1,readFilters());
</script></body></html>
